name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q -rs
        env:
          DELIVERY_REQUIRE_LINUX_CHECKS: "1"
      - run: uv build
  sandbox-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q -rs -m os tests/os
