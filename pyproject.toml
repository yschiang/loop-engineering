[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[project]
name = "loopctl"
version = "0.1.0"
description = "Thin delivery controller: durable run state and human decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
]

[project.scripts]
loopctl = "loopctl.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
xfail_strict = true
markers = [
    "only_on(platform): run only where current_platform() equals platform; skipped elsewhere",
]
